name: Simple Demo Workflow

# 1. Choose what event triggers this code
on: [push]

# 2. Define the tasks (jobs) to run
jobs:
  say-hello:
    # Use a standard cloud server provided by GitHub
    runs-on: ubuntu-latest

    # The actual steps to execute
    steps:
      # Step 1: Download your repo code onto the server
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Run a basic terminal command
      - name: Run Hello World
        run: echo "Hello, World! Your GitHub Action is working perfectly."
